apiVersion: v1
kind: Namespace
metadata:
  name: crashpilot
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: crashpilot-agent
  namespace: crashpilot
  labels:
    app.kubernetes.io/name: crashpilot
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crashpilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crashpilot
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      # When a pod is stopped, its entrypoint lets a heartbeat in flight
      # finish, stops the heartbeat loop, then signs the node off, so the node
      # reads as "Shut down cleanly" rather than an outage (the next heartbeat
      # undoes it, so rollouts are unaffected). That needs the pod to be
      # stopped gracefully: on a node shutdown, only kubelet's graceful node
      # shutdown (shutdownGracePeriod) does that. `kubectl drain` leaves
      # DaemonSet pods running, so a drained node signs off when it shuts down.
      terminationGracePeriodSeconds: 30
      containers:
        - name: crashpilot
          image: ghcr.io/crashpilotx/crashpilot-agent:latest
          # Always, while the tag is :latest: IfNotPresent kept whatever image
          # a node pulled first, however old.
          imagePullPolicy: Always
          # Requests and limits keep it out of the BestEffort class, the first
          # evicted under node pressure, exactly when crash evidence matters.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          env:
            - name: CRASHPILOT_DATA_DIR
              value: /var/lib/crashpilot
            # Enrolled credentials are written to $CRASHPILOT_CONFIG_DIR/.env.
            # Keeping that on the node's hostPath means a pod restart or a
            # DaemonSet rollout carries on as the same system.
            - name: CRASHPILOT_CONFIG_DIR
              value: /var/lib/crashpilot
            # Each node enrolls under its own node name, so every node is its
            # own system in the dashboard. (One shared system_id made a whole
            # cluster report as a single machine.)
            - name: CRASHPILOT_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          envFrom:
            - secretRef:
                name: crashpilot-agent
                optional: true
          ports:
            - name: api
              containerPort: 7878
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/crashpilot
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: journal
              mountPath: /run/log/journal
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: dev
              mountPath: /dev
      volumes:
        - name: data
          hostPath:
            path: /var/lib/crashpilot
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: /var/log
        - name: journal
          hostPath:
            path: /run/log/journal
            type: DirectoryOrCreate
        - name: sys
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
