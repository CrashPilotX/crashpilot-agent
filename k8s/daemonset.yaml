apiVersion: v1
kind: Namespace
metadata:
  name: crashpilot
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: crashpilot-agent
  namespace: crashpilot
  labels:
    app.kubernetes.io/name: crashpilot
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: crashpilot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: crashpilot
    spec:
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: crashpilot
          image: ghcr.io/crashpilotx/crashpilot-agent:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
            readOnlyRootFilesystem: false
          env:
            - name: CRASHPILOT_DATA_DIR
              value: /var/lib/crashpilot
          envFrom:
            - secretRef:
                name: crashpilot-agent
                optional: true
          ports:
            - name: api
              containerPort: 7878
          readinessProbe:
            httpGet:
              path: /health
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/crashpilot
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: journal
              mountPath: /run/log/journal
              readOnly: true
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: dev
              mountPath: /dev
      volumes:
        - name: data
          hostPath:
            path: /var/lib/crashpilot
            type: DirectoryOrCreate
        - name: var-log
          hostPath:
            path: /var/log
        - name: journal
          hostPath:
            path: /run/log/journal
            type: DirectoryOrCreate
        - name: sys
          hostPath:
            path: /sys
        - name: dev
          hostPath:
            path: /dev
