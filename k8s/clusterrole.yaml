apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crashpilot
  labels:
    app.kubernetes.io/name: crashpilot
rules:
  # Read pods, events, nodes — needed for crash detection
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Read node metrics (kubectl top node)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["nodes", "pods"]
    verbs: ["get", "list"]
  # Read resource quotas and limits
  - apiGroups: [""]
    resources: ["resourcequotas", "limitranges"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crashpilot
  labels:
    app.kubernetes.io/name: crashpilot
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crashpilot
subjects:
  - kind: ServiceAccount
    name: crashpilot
    namespace: crashpilot
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crashpilot
  namespace: crashpilot
  labels:
    app.kubernetes.io/name: crashpilot
