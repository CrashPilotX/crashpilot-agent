apiVersion: v1
kind: Namespace
metadata:
  name: crashpilot
---
apiVersion: v1
kind: Secret
metadata:
  name: crashpilot-agent
  namespace: crashpilot
type: Opaque
stringData:
  CRASHPILOT_SUPABASE_URL: https://your-project.supabase.co
  CRASHPILOT_SUPABASE_ANON_KEY: your-anon-key
  CRASHPILOT_SUPABASE_SYSTEM_ID: your-system-id
  CRASHPILOT_SUPABASE_TOKEN: your-agent-token
