apiVersion: v1
kind: Namespace
metadata:
  name: crashpilot
---
apiVersion: v1
kind: Secret
metadata:
  name: crashpilot-agent
  namespace: crashpilot
type: Opaque
stringData:
  # A join token from the dashboard's Systems page. Every node enrolls itself
  # with it under its own node name. Use one token per cluster (node names
  # repeat across clusters), and mark it ephemeral for autoscaled node pools
  # so nodes that go away are retired automatically.
  CRASHPILOT_ENROLL_TOKEN: cpjoin_replace-with-your-join-token

  # Older alternative: fixed credentials for a single system. Every node that
  # mounts this Secret then reports as that one system, so use it only for a
  # one-node cluster.
  # CRASHPILOT_SUPABASE_URL: https://your-project.supabase.co
  # CRASHPILOT_SUPABASE_ANON_KEY: your-anon-key
  # CRASHPILOT_SUPABASE_SYSTEM_ID: your-system-id
  # CRASHPILOT_SUPABASE_TOKEN: your-agent-token
